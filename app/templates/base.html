<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <!-- HTMX pinned version -->
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoMVMf30509Znylkdyn8Y3P63xeMWnxjz9" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --header-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary-color: #0284c7;
            --footer-text: #64748b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }
        main {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        footer {
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            padding: 1rem 2rem;
            text-align: center;
            color: var(--footer-text);
            font-size: 0.875rem;
        }
        .notice-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <a href="/" class="brand">{{ app_name }}</a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div>
            <span class="notice-badge">Notice</span>
            <p>Demo uses synthetic data. Do not upload confidential files.</p>
        </div>
    </footer>
</body>
</html>
